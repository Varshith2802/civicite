[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "civicite"
version = "0.1.0"
description = "Verified, citation-first RAG agent for Swedish public services (Skatteverket, Försäkringskassan, CSN ...)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Varshith" }]
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2"]

[project.optional-dependencies]
dense = ["sentence-transformers>=2.7", "numpy>=1.24"]
pdf = ["pypdf>=4"]
dev = ["pytest>=7", "httpx>=0.27"]

[project.scripts]
civicite = "civicite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"civicite.api" = ["ui.html"]
"civicite.eval" = ["dataset.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
