<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CiviCite</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --ink:#1d2329; --muted:#5f6b76; --line:#e2e4e7; --accent:#0b5cad;
          --ok:#1d7a46; --warn:#a15c00; --bad:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171a; --card:#1d2227; --ink:#e8eaed; --muted:#9aa4ae;
          --line:#2f363d; --accent:#6aa9ff; --ok:#5cc489; --warn:#f0b35a; --bad:#ff8a80; } }
  * { box-sizing:border-box } body { margin:0; font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;
    background:var(--bg); color:var(--ink) }
  main { max-width:820px; margin:0 auto; padding:28px 16px 64px }
  h1 { margin:0 0 4px; font-size:28px } .sub { color:var(--muted); margin:0 0 20px }
  form { display:flex; gap:8px } input[type=text] { flex:1; padding:12px 14px; border:1px solid var(--line);
    border-radius:10px; background:var(--card); color:var(--ink); font-size:16px }
  button { padding:12px 18px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-weight:600;
    cursor:pointer } button:disabled { opacity:.6 }
  .row { display:flex; gap:12px; align-items:center; margin:10px 0 18px; color:var(--muted); font-size:14px; flex-wrap:wrap }
  .chips button { background:transparent; color:var(--accent); border:1px solid var(--line); padding:6px 10px;
    font-weight:500; font-size:13px; margin:0 6px 6px 0 }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-top:14px }
  .answer { font-size:17px } sup a { text-decoration:none; color:var(--accent); font-weight:700 }
  .badge { display:inline-block; padding:3px 10px; border-radius:999px; font-size:13px; font-weight:600;
    border:1px solid currentColor } .verified{color:var(--ok)} .partially-verified{color:var(--warn)}
  .unverified{color:var(--bad)} .abstain{color:var(--muted)} .no-claims{color:var(--muted)}
  .src { border-top:1px solid var(--line); padding:12px 0 } .src:first-child{border-top:0}
  .src h3 { margin:0; font-size:15px } .src .meta { color:var(--muted); font-size:13px }
  .src p { margin:6px 0 0; font-size:14px; white-space:pre-wrap }
  .bad { color:var(--bad); font-size:14px } .note { color:var(--muted); font-size:13px; margin-top:10px }
  details summary { cursor:pointer; color:var(--muted); font-size:14px }
  pre { white-space:pre-wrap; font-size:12px; background:var(--bg); padding:10px; border-radius:8px; overflow:auto }
</style>
</head>
<body>
<main>
  <h1>CiviCite</h1>
  <p class="sub">Answers about Swedish public services, with a source for every sentence. If the documents
     do not say it, CiviCite says so instead of guessing.</p>
  <form id="f">
    <input id="q" type="text" placeholder="e.g. I moved on 2026-03-10 - when must I report it?" autocomplete="off" required>
    <button id="go">Ask</button>
  </form>
  <div class="row">
    <label>Mode <select id="mode"><option value="auto">auto</option><option value="extractive">extractive (no LLM)</option>
      <option value="llm">LLM + tools</option></select></label>
    <span id="health"></span>
  </div>
  <div class="chips" id="chips"></div>
  <div id="out"></div>
</main>
<script>
const examples = ["How long do I have to report a move to Skatteverket?",
  "I moved on 2026-03-10. What is the last day to report the move?",
  "What is the last day to submit the income tax return in 2026?",
  "How many days of parental benefit do parents get per child?",
  "Hur lång tid har jag på mig att göra en flyttanmälan?",
  "What is the capital of Norway?"];
const chips = document.getElementById('chips');
examples.forEach(e => { const b = document.createElement('button'); b.type='button'; b.textContent = e;
  b.onclick = () => { document.getElementById('q').value = e; ask(); }; chips.appendChild(b); });
fetch('/api/health').then(r => r.json()).then(h => {
  document.getElementById('health').textContent = `${h.chunks} chunks indexed · ${h.dense ? 'hybrid' : 'BM25'} search · LLM: ${h.llm || 'none'}`;
});
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(r) {
  let html = esc(r.answer).replace(/\[(\d+(?:\s*[,;]\s*\d+)*)\]/g, (m, g) =>
    g.split(/[,;]/).map(n => `<sup><a href="#src-${n.trim()}">[${n.trim()}]</a></sup>`).join(''))
    .replace(/\[calc\]/gi, '<sup title="computed by the deadline tool">[calc]</sup>');
  const v = r.verification;
  const label = r.abstained ? 'abstain' : v.label;
  let out = `<div class="card"><div class="answer">${html}</div><div class="row">
    <span class="badge ${label}">${r.abstained ? 'no answer in sources' : v.label.replace('-', ' ')}</span>
    <span>faithfulness ${v.faithfulness} · citations ${v.citation_coverage} · confidence ${r.confidence} · ${r.mode} · ${r.latency_ms} ms</span></div>`;
  if (Object.keys(r.pii_redacted).length) out += `<div class="note">Personal data was removed from your question before processing: ${esc(JSON.stringify(r.pii_redacted))}</div>`;
  if (v.unsupported.length) out += `<div class="bad">Unsupported: ${v.unsupported.map(esc).join(' | ')}</div>`;
  if (r.error) out += `<div class="note">${esc(r.error)}</div>`;
  out += `</div>`;
  if (r.sources.length) {
    out += `<div class="card">` + r.sources.map(s => `<div class="src" id="src-${s.n}"><h3>[${s.n}] ${esc(s.title)} › ${esc(s.section)}</h3>
      <div class="meta">${esc(s.agency)} ${s.url ? `· <a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url)}</a>` : ''}</div>
      <p>${esc(s.text)}</p></div>`).join('') + `</div>`;
  }
  if (r.tool_calls.length) out += `<div class="card"><details><summary>Tool calls (${r.tool_calls.length})</summary><pre>${esc(JSON.stringify(r.tool_calls, null, 2))}</pre></details></div>`;
  document.getElementById('out').innerHTML = out;
}
async function ask() {
  const q = document.getElementById('q').value.trim(); if (!q) return;
  const btn = document.getElementById('go'); btn.disabled = true; btn.textContent = '...';
  try {
    const r = await fetch('/api/ask', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({question:q, mode:document.getElementById('mode').value})});
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || r.statusText);
    render(data);
  } catch (e) { document.getElementById('out').innerHTML = `<div class="card bad">${esc(String(e))}</div>`; }
  finally { btn.disabled = false; btn.textContent = 'Ask'; }
}
document.getElementById('f').onsubmit = e => { e.preventDefault(); ask(); };
</script>
</body>
</html>
