<title>CiviCite</title>
<meta name="description" content="Ask about Swedish public services and get a short, verified answer with the source of every sentence.">

<style>
/* Layout: a public-service help desk. A deep blue band holds the question; answers and topic tiles sit on a light page below.
   Blue = actions, yellow = calculated or quoted, green = verified. */
:root {
  --page: #f3f5f8;
  --band: #0b3a6e;
  --band-ink: #ffffff;
  --band-muted: #b9cde6;
  --card: #ffffff;
  --ink: #10233f;
  --muted: #5b6b81;
  --line: #e2e8f0;
  --blue: #0a5ea8;
  --blue-soft: #eaf2fb;
  --yellow: #f7c600;
  --yellow-soft: #fff5c7;
  --mark: #ffeea0;
  --ok: #157a48;
  --ok-soft: #e4f4ec;
  --warn: #a8640a;
  --bad: #b42318;
  --shadow: 0 1px 2px rgba(16, 35, 63, .06), 0 10px 30px rgba(16, 35, 63, .08);
  --serif: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --sans: "Source Sans 3", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0a1220; --band: #0d2547; --band-ink: #f1f5fb; --band-muted: #9fb7d6; --card: #111c2f; --ink: #e8eef7; --muted: #9eb0c7;
    --line: #24344d; --blue: #6ab4ff; --blue-soft: #15304f; --yellow: #ffd64d; --yellow-soft: #3a3108; --mark: #57490a;
    --ok: #52cb8f; --ok-soft: #10301f; --warn: #f2b453; --bad: #ff8278; --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 30px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0a1220; --band: #0d2547; --band-ink: #f1f5fb; --band-muted: #9fb7d6; --card: #111c2f; --ink: #e8eef7; --muted: #9eb0c7;
  --line: #24344d; --blue: #6ab4ff; --blue-soft: #15304f; --yellow: #ffd64d; --yellow-soft: #3a3108; --mark: #57490a;
  --ok: #52cb8f; --ok-soft: #10301f; --warn: #f2b453; --bad: #ff8278; --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 30px rgba(0,0,0,.3); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--page); color: var(--ink); font: 17px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
button, textarea { font: inherit; color: inherit; }
a { color: var(--blue); }
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; border-radius: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 880px; margin: 0 auto; padding-inline: 20px; }
@media (max-width: 520px) { .wrap { padding-inline: 16px; } }

/* band */
.band { background: var(--band); color: var(--band-ink); padding-block: 18px 34px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: inline-flex; align-items: center; gap: 10px; font: 700 21px/1 var(--serif); color: var(--band-ink); text-decoration: none; }
.logo { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 9px; background: var(--band-ink); color: var(--band);
  font: 700 15px/1 var(--serif); letter-spacing: -.02em; }
.logo i { font-style: normal; color: var(--yellow); }
.top a.code { color: var(--band-muted); font-size: 15px; font-weight: 600; text-decoration: none; }
.top a.code:hover { color: var(--band-ink); }
.band h1 { margin: 38px 0 0; font: 600 clamp(30px, 6vw, 46px)/1.1 var(--serif); letter-spacing: -.015em; text-wrap: balance; }
.band p.lede { margin: 10px 0 0; color: var(--band-muted); font-size: 18px; }
.ask { margin-top: 24px; display: flex; align-items: center; gap: 10px; background: var(--card); color: var(--ink); border-radius: 16px;
  padding: 8px 8px 8px 18px; box-shadow: 0 12px 34px rgba(0, 0, 0, .22); }
.ask svg.search { flex: none; width: 22px; height: 22px; color: var(--muted); }
.ask textarea { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; resize: none; font-size: 18px; line-height: 1.45; padding: 10px 0; max-height: 150px; }
.ask textarea::placeholder { color: var(--muted); }
.go { flex: none; border: 0; border-radius: 12px; background: var(--blue); color: #fff; font-weight: 700; font-size: 16px; padding: 12px 20px; cursor: pointer; }
.go:hover { filter: brightness(1.08); }
@media (max-width: 520px) { .go { padding: 12px 14px; } .go span { display: none; } }
.go svg { width: 20px; height: 20px; vertical-align: -4px; }

/* answer */
.result { margin-top: -18px; position: relative; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 22px 0; flex-wrap: wrap; }
.card-head .q { font-size: 15px; color: var(--muted); min-width: 0; }
.card-head .q b { color: var(--ink); font-weight: 600; }
.badge { appearance: none; border: 0; display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 5px 12px; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.badge svg { width: 16px; height: 16px; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.warn { background: var(--yellow-soft); color: var(--warn); }
.badge.bad { background: var(--yellow-soft); color: var(--bad); }
.body { padding: 14px 22px 20px; display: grid; gap: 14px; }
@media (max-width: 520px) { .card-head, .body { padding-inline: 16px; } }
.token { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .04em; background: var(--blue-soft); color: var(--blue); border-radius: 6px; padding: 1px 6px; }
.privacy { display: flex; gap: 10px; align-items: center; background: var(--blue-soft); border-radius: 12px; padding: 10px 14px; font-size: 15px; }
.privacy svg { flex: none; width: 20px; height: 20px; color: var(--blue); }
.answer { margin: 0; font: 400 21px/1.6 var(--serif); }
.ref { appearance: none; border: 0; background: var(--blue-soft); color: var(--blue); border-radius: 6px; min-width: 22px; height: 22px; padding: 0 6px;
  font: 700 13px/22px var(--sans); cursor: pointer; vertical-align: 3px; margin-left: 3px; }
.ref:hover, .ref[aria-pressed="true"] { background: var(--blue); color: #fff; }
.calc { display: inline-block; vertical-align: 3px; background: var(--yellow-soft); color: var(--ink); border: 1px solid var(--yellow); border-radius: 999px;
  padding: 0 9px; font: 600 12.5px/20px var(--sans); margin-left: 3px; cursor: help; }
.checks { margin: 0; padding: 12px 14px; list-style: none; display: grid; gap: 8px; border-radius: 12px; background: var(--page); font-size: 15px; }
.checks li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 8px; }
.checks svg { width: 18px; height: 18px; margin-top: 3px; }
.checks .y { color: var(--ok); } .checks .n { color: var(--bad); } .checks .m { color: var(--muted); }
.checks small { display: block; color: var(--muted); font-size: 13.5px; }

.srcrow { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.src { appearance: none; text-align: left; border: 1.5px solid var(--line); background: var(--card); border-radius: 14px; padding: 10px 12px; cursor: pointer;
  display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: start; }
.src:hover { border-color: var(--blue); }
.src[aria-pressed="true"] { border-color: var(--blue); background: var(--blue-soft); }
.num { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; background: var(--blue); color: #fff; font-weight: 700; font-size: 13px; }
.src b { display: block; font-size: 15px; font-weight: 600; line-height: 1.3; }
.src small { display: block; color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.quote { border-left: 3px solid var(--yellow); padding: 4px 0 4px 16px; font: 17px/1.6 var(--serif); }
.quote mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 2px; }
.quote .meta { margin-top: 8px; font: 14px/1.4 var(--sans); color: var(--muted); }

.none { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 14px; padding: 20px 22px; }
.none .ic { width: 44px; height: 44px; border-radius: 12px; background: var(--yellow-soft); color: var(--warn); display: grid; place-items: center; }
.none .ic svg { width: 24px; height: 24px; }
.none h2 { margin: 0; font: 600 22px/1.25 var(--serif); }
.none p { margin: 6px 0 0; color: var(--muted); }

/* topics */
.topics { margin-top: 34px; }
.topics h2 { margin: 0 0 12px; font-size: 14px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 640px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.tile { appearance: none; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 16px; padding: 14px 16px; cursor: pointer;
  display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 14px; align-items: center; transition: transform .12s, box-shadow .12s, border-color .12s; }
.tile:hover { border-color: var(--blue); box-shadow: var(--shadow); transform: translateY(-1px); }
.tile[aria-pressed="true"] { border-color: var(--blue); background: var(--blue-soft); }
.tile .ti { width: 42px; height: 42px; border-radius: 12px; background: var(--blue-soft); color: var(--blue); display: grid; place-items: center; }
.tile .ti svg { width: 22px; height: 22px; }
.tile b { display: block; font-size: 16.5px; }
.tile span.qq { display: block; color: var(--muted); font-size: 14.5px; line-height: 1.35; margin-top: 2px; }

footer { margin-block: 40px 30px; font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 16px; }
@media (prefers-reduced-motion: reduce) { .tile { transition: none; } .tile:hover { transform: none; } }
</style>
</head>

<header class="band">
  <div class="wrap">
    <div class="top">
      <a class="brand" href="#" id="home"><span class="logo" aria-hidden="true"><i>[</i>1<i>]</i></span>CiviCite</a>
      <a class="code" id="src-link" href="https://github.com/Varshith2802/civicite" target="_blank" rel="noopener" hidden>Code</a>

    <h1>What do you need help with?</h1>

      <svg class="search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

</header>

<main class="wrap">

    <span>Built by Tirumala Varshith Sagar Nallaigari · <a href="https://github.com/Varshith2802" target="_blank" rel="noopener">github.com/Varshith2802</a></span>
  </footer>
</main>

<script type="application/json" id="cc-data">{"chunks": [{"chunk_id": "arbetsformedlingen-job-seeker#0", "doc_id": "arbetsformedlingen-job-seeker", "title": "Registering as a job seeker and unemployment insurance", "agency": "Arbetsf\u00f6rmedlingen (Swedish Public Employment Service)", "url": "https://arbetsformedlingen.se/", "section": "Register on your first day of unemployment", "text": "If you become unemployed, register as a job seeker with Arbetsf\u00f6rmedlingen on your first day of unemployment. Registration is required to receive unemployment benefit."}, {"chunk_id": "arbetsformedlingen-job-seeker#1", "doc_id": "arbetsformedlingen-job-seeker", "title": "Registering as a job seeker and unemployment insurance", "agency": "Arbetsf\u00f6rmedlingen (Swedish Public Employment Service)", "url": "https://arbetsformedlingen.se/", "section": "Unemployment insurance fund", "text": "Unemployment benefit is paid by an unemployment insurance fund (a-kassa), not by Arbetsf\u00f6rmedlingen. You apply for the benefit to your a-kassa after registering with Arbetsf\u00f6rmedlingen."}, {"chunk_id": "arbetsformedlingen-job-seeker#2", "doc_id": "arbetsformedlingen-job-seeker", "title": "Registering as a job seeker and unemployment insurance", "agency": "Arbetsf\u00f6rmedlingen (Swedish Public Employment Service)", "url": "https://arbetsformedlingen.se/", "section": "Activity reports", "text": "While registered, you report your job search activities to Arbetsf\u00f6rmedlingen every month in an activity report (aktivitetsrapport)."}, {"chunk_id": "csn-student-aid#0", "doc_id": "csn-student-aid", "title": "Student aid (studiemedel)", "agency": "CSN (Swedish Board of Student Finance)", "url": "https://www.csn.se/", "section": "What it consists of", "text": "Student aid (studiemedel) from CSN consists of a grant (bidrag), which you do not pay back, and a loan (l\u00e5n), which you repay. You can choose to take only the grant."}, {"chunk_id": "csn-student-aid#1", "doc_id": "csn-student-aid", "title": "Student aid (studiemedel)", "agency": "CSN (Swedish Board of Student Finance)", "url": "https://www.csn.se/", "section": "Requirements", "text": "You must be studying at least half-time (50 percent) in a programme that qualifies for student aid. To keep receiving student aid, you need to pass your studies at a sufficient pace; CSN checks your study results before granting aid for a new period."}, {"chunk_id": "csn-student-aid#2", "doc_id": "csn-student-aid", "title": "Student aid (studiemedel)", "agency": "CSN (Swedish Board of Student Finance)", "url": "https://www.csn.se/", "section": "Applying", "text": "You apply to CSN for each study period, normally in CSN's e-service with an e-identification. It is a good idea to apply well before the period starts so that the money is paid on time."}, {"chunk_id": "e-identification#0", "doc_id": "e-identification", "title": "E-identification (e-legitimation) for public e-services", "agency": "DIGG (Agency for Digital Government)", "url": "https://www.digg.se/", "section": "What it is", "text": "An e-identification lets you prove your identity online, for example when you log in to the e-services of Skatteverket, F\u00f6rs\u00e4kringskassan, CSN or your region's healthcare services."}, {"chunk_id": "e-identification#1", "doc_id": "e-identification", "title": "E-identification (e-legitimation) for public e-services", "agency": "DIGG (Agency for Digital Government)", "url": "https://www.digg.se/", "section": "Common options", "text": "The most widely used e-identification in Sweden is BankID, which is issued by banks. Freja eID is another approved e-identification that can be ordered through an app. To get an e-identification you normally need a Swedish personal identity number."}, {"chunk_id": "e-identification#2", "doc_id": "e-identification", "title": "E-identification (e-legitimation) for public e-services", "agency": "DIGG (Agency for Digital Government)", "url": "https://www.digg.se/", "section": "Security advice", "text": "Never log in with your e-identification because someone called you and asked you to. Public agencies and banks never ask you to identify yourself with BankID during a phone call that they initiated."}, {"chunk_id": "forsakringskassan-parental-benefit#0", "doc_id": "forsakringskassan-parental-benefit", "title": "Parental benefit (f\u00f6r\u00e4ldrapenning)", "agency": "F\u00f6rs\u00e4kringskassan (Swedish Social Insurance Agency)", "url": "https://www.forsakringskassan.se/", "section": "How many days", "text": "Parents can receive parental benefit for a total of 480 days per child. When the parents have joint custody, the days are divided equally between them, and 90 days are reserved for each parent. Reserved days cannot be transferred to the other parent."}, {"chunk_id": "forsakringskassan-parental-benefit#1", "doc_id": "forsakringskassan-parental-benefit", "title": "Parental benefit (f\u00f6r\u00e4ldrapenning)", "agency": "F\u00f6rs\u00e4kringskassan (Swedish Social Insurance Agency)", "url": "https://www.forsakringskassan.se/", "section": "Benefit levels", "text": "Most of the days are paid at sickness benefit level, which is based on your income. The remaining days are paid at a fixed minimum level."}, {"chunk_id": "forsakringskassan-parental-benefit#2", "doc_id": "forsakringskassan-parental-benefit", "title": "Parental benefit (f\u00f6r\u00e4ldrapenning)", "agency": "F\u00f6rs\u00e4kringskassan (Swedish Social Insurance Agency)", "url": "https://www.forsakringskassan.se/", "section": "Saving days for later", "text": "Parental benefit can be used until the child turns 12 or finishes the fifth year of school. After the child turns four, a maximum of 96 days can be saved for later use."}, {"chunk_id": "forsakringskassan-parental-benefit#3", "doc_id": "forsakringskassan-parental-benefit", "title": "Parental benefit (f\u00f6r\u00e4ldrapenning)", "agency": "F\u00f6rs\u00e4kringskassan (Swedish Social Insurance Agency)", "url": "https://www.forsakringskassan.se/", "section": "How to apply", "text": "You apply to F\u00f6rs\u00e4kringskassan, normally through its e-service with an e-identification. You should also tell your employer about planned parental leave in good time."}, {"chunk_id": "forsakringskassan-sick-pay#0", "doc_id": "forsakringskassan-sick-pay", "title": "Sick pay and sickness benefit for employees", "agency": "F\u00f6rs\u00e4kringskassan (Swedish Social Insurance Agency)", "url": "https://www.forsakringskassan.se/", "section": "The first 14 days", "text": "If you are employed and become ill, you must report sick to your employer. The employer pays sick pay (sjukl\u00f6n) for the first 14 days of the sick period. A deduction (karensavdrag) is made from the sick pay."}, {"chunk_id": "forsakringskassan-sick-pay#1", "doc_id": "forsakringskassan-sick-pay", "title": "Sick pay and sickness benefit for employees", "agency": "F\u00f6rs\u00e4kringskassan (Swedish Social Insurance Agency)", "url": "https://www.forsakringskassan.se/", "section": "Medical certificate", "text": "From the eighth day of the sick period you need a medical certificate (l\u00e4karintyg) that shows how the illness reduces your ability to work."}, {"chunk_id": "forsakringskassan-sick-pay#2", "doc_id": "forsakringskassan-sick-pay", "title": "Sick pay and sickness benefit for employees", "agency": "F\u00f6rs\u00e4kringskassan (Swedish Social Insurance Agency)", "url": "https://www.forsakringskassan.se/", "section": "From day 15", "text": "If you are still ill after 14 days, the employer reports this to F\u00f6rs\u00e4kringskassan, and you can apply for sickness benefit (sjukpenning) from F\u00f6rs\u00e4kringskassan from day 15."}, {"chunk_id": "forsakringskassan-temporary-parental-benefit#0", "doc_id": "forsakringskassan-temporary-parental-benefit", "title": "Temporary parental benefit for caring for a sick child (VAB)", "agency": "F\u00f6rs\u00e4kringskassan (Swedish Social Insurance Agency)", "url": "https://www.forsakringskassan.se/", "section": "When it applies", "text": "You can receive temporary parental benefit when you stay home from work to care for a sick child who is under 12 years old. Staying home to care for a sick child is often called \"vabba\"."}, {"chunk_id": "forsakringskassan-temporary-parental-benefit#1", "doc_id": "forsakringskassan-temporary-parental-benefit", "title": "Temporary parental benefit for caring for a sick child (VAB)", "agency": "F\u00f6rs\u00e4kringskassan (Swedish Social Insurance Agency)", "url": "https://www.forsakringskassan.se/", "section": "How many days", "text": "Temporary parental benefit can be paid for up to 120 days per child and year."}, {"chunk_id": "forsakringskassan-temporary-parental-benefit#2", "doc_id": "forsakringskassan-temporary-parental-benefit", "title": "Temporary parental benefit for caring for a sick child (VAB)", "agency": "F\u00f6rs\u00e4kringskassan (Swedish Social Insurance Agency)", "url": "https://www.forsakringskassan.se/", "section": "Reporting and applying", "text": "Tell your employer that you are staying home, and report the absence (VAB) to F\u00f6rs\u00e4kringskassan. You must apply for the benefit no later than 90 days after the first day you stayed home."}, {"chunk_id": "kommun-sfi#0", "doc_id": "kommun-sfi", "title": "Swedish for immigrants (SFI)", "agency": "Your municipality (kommun)", "url": "https://www.skolverket.se/", "section": "What SFI is", "text": "Swedish for immigrants (svenska f\u00f6r invandrare, SFI) is a free basic Swedish language course for adults whose first language is not Swedish. SFI is organised by the municipalities."}, {"chunk_id": "kommun-sfi#1", "doc_id": "kommun-sfi", "title": "Swedish for immigrants (SFI)", "agency": "Your municipality (kommun)", "url": "https://www.skolverket.se/", "section": "Who can study", "text": "To study SFI you generally need to be registered (folkbokf\u00f6rd) in the municipality and lack basic knowledge of Swedish."}, {"chunk_id": "kommun-sfi#2", "doc_id": "kommun-sfi", "title": "Swedish for immigrants (SFI)", "agency": "Your municipality (kommun)", "url": "https://www.skolverket.se/", "section": "How to apply", "text": "You apply to the adult education unit (vuxenutbildning) of the municipality where you are registered, usually through the municipality's website."}, {"chunk_id": "skatteverket-id-card#0", "doc_id": "skatteverket-id-card", "title": "Applying for an identity card from Skatteverket", "agency": "Skatteverket (Swedish Tax Agency)", "url": "https://www.skatteverket.se/", "section": "Who can apply", "text": "Skatteverket issues identity cards to people who are registered in the Swedish population register (folkbokf\u00f6rda) and have a personal identity number."}, {"chunk_id": "skatteverket-id-card#1", "doc_id": "skatteverket-id-card", "title": "Applying for an identity card from Skatteverket", "agency": "Skatteverket (Swedish Tax Agency)", "url": "https://www.skatteverket.se/", "section": "How to apply", "text": "1. Pay the application fee before your visit. 2. Visit one of Skatteverket's service offices in person. You are photographed at the office. 3. Prove your identity with a valid identity document. If you do not have one, a person who knows you and holds a valid Swedish identity document can vouch for your identity (intygsgivare)."}, {"chunk_id": "skatteverket-id-card#2", "doc_id": "skatteverket-id-card", "title": "Applying for an identity card from Skatteverket", "agency": "Skatteverket (Swedish Tax Agency)", "url": "https://www.skatteverket.se/", "section": "Collecting the card", "text": "The card is collected in person at the service office you choose when you apply."}, {"chunk_id": "skatteverket-moving#0", "doc_id": "skatteverket-moving", "title": "Reporting a move (flyttanm\u00e4lan)", "agency": "Skatteverket (Swedish Tax Agency)", "url": "https://www.skatteverket.se/", "section": "Who must report", "text": "Everyone who is registered in the Swedish population register (folkbokf\u00f6ring) and moves to a new permanent address in Sweden must report the move to Skatteverket. Your registered address affects, among other things, which municipality and region you belong to, where you pay municipal tax, and where you receive healthcare and school placements."}, {"chunk_id": "skatteverket-moving#1", "doc_id": "skatteverket-moving", "title": "Reporting a move (flyttanm\u00e4lan)", "agency": "Skatteverket (Swedish Tax Agency)", "url": "https://www.skatteverket.se/", "section": "Deadline", "text": "You must report the move to Skatteverket within one week after you have moved."}, {"chunk_id": "skatteverket-moving#2", "doc_id": "skatteverket-moving", "title": "Reporting a move (flyttanm\u00e4lan)", "agency": "Skatteverket (Swedish Tax Agency)", "url": "https://www.skatteverket.se/", "section": "How to report", "text": "The easiest way is the e-service for reporting a move on Skatteverket's website, where you log in with an e-identification such as BankID or Freja eID. You can also report on a paper form (flyttanm\u00e4lan) and send it by post. Children who move with their guardians are included when the guardians report the move."}, {"chunk_id": "skatteverket-moving#3", "doc_id": "skatteverket-moving", "title": "Reporting a move (flyttanm\u00e4lan)", "agency": "Skatteverket (Swedish Tax Agency)", "url": "https://www.skatteverket.se/", "section": "Mail forwarding is a separate service", "text": "Reporting a move to Skatteverket updates your registered address. Forwarding of letters and parcels (efters\u00e4ndning) is a separate paid service that is not handled by Skatteverket."}, {"chunk_id": "skatteverket-personnummer#0", "doc_id": "skatteverket-personnummer", "title": "Personal identity number and coordination number", "agency": "Skatteverket (Swedish Tax Agency)", "url": "https://www.skatteverket.se/", "section": "Personal identity number", "text": "A personal identity number (personnummer) is assigned by Skatteverket to everyone who is registered in the Swedish population register (folkbokf\u00f6rd). Children born in Sweden get one at birth. A person who moves to Sweden is normally registered if they are expected to live in Sweden for at least one year."}, {"chunk_id": "skatteverket-personnummer#1", "doc_id": "skatteverket-personnummer", "title": "Personal identity number and coordination number", "agency": "Skatteverket (Swedish Tax Agency)", "url": "https://www.skatteverket.se/", "section": "Format", "text": "The number has ten digits: the date of birth as YYMMDD, followed by a hyphen and four digits (YYMMDD-XXXX). The last digit is a check digit calculated with the Luhn algorithm. When a person turns 100 years old, the hyphen is replaced by a plus sign. In many digital systems the twelve-digit form YYYYMMDD-XXXX is used."}, {"chunk_id": "skatteverket-personnummer#2", "doc_id": "skatteverket-personnummer", "title": "Personal identity number and coordination number", "agency": "Skatteverket (Swedish Tax Agency)", "url": "https://www.skatteverket.se/", "section": "Coordination number", "text": "A coordination number (samordningsnummer) is an identity number for people who are not, or have not been, registered in the population register, for example people who work in Sweden for a short period. It has the same structure as a personal identity number, but 60 is added to the day of birth, so a person born on the 5th of a month gets 65 as the day digits."}, {"chunk_id": "skatteverket-personnummer#3", "doc_id": "skatteverket-personnummer", "title": "Personal identity number and coordination number", "agency": "Skatteverket (Swedish Tax Agency)", "url": "https://www.skatteverket.se/", "section": "Protecting the number", "text": "A personal identity number is not secret in Sweden, but you should be careful about sharing it together with other personal data, because it can be misused for identity fraud."}, {"chunk_id": "skatteverket-tax-return#0", "doc_id": "skatteverket-tax-return", "title": "Filing the annual income tax return (inkomstdeklaration)", "agency": "Skatteverket (Swedish Tax Agency)", "url": "https://www.skatteverket.se/", "section": "Who files", "text": "Individuals who had taxable income in Sweden during the previous calendar year normally receive an income tax return from Skatteverket in the spring, pre-filled with information from employers, banks and authorities."}, {"chunk_id": "skatteverket-tax-return#1", "doc_id": "skatteverket-tax-return", "title": "Filing the annual income tax return (inkomstdeklaration)", "agency": "Skatteverket (Swedish Tax Agency)", "url": "https://www.skatteverket.se/", "section": "Deadline", "text": "The income tax return must be submitted no later than 2 May. If 2 May falls on a Saturday, Sunday or public holiday, the deadline moves to the next working day. If you need more time, you can apply for a deferral (anst\u00e5nd) before the deadline."}, {"chunk_id": "skatteverket-tax-return#2", "doc_id": "skatteverket-tax-return", "title": "Filing the annual income tax return (inkomstdeklaration)", "agency": "Skatteverket (Swedish Tax Agency)", "url": "https://www.skatteverket.se/", "section": "How to file", "text": "You check the pre-filled information, correct or add what is missing, and approve the return. This can be done in Skatteverket's e-service or app with an e-identification, or on paper."}, {"chunk_id": "skatteverket-tax-return#3", "doc_id": "skatteverket-tax-return", "title": "Filing the annual income tax return (inkomstdeklaration)", "agency": "Skatteverket (Swedish Tax Agency)", "url": "https://www.skatteverket.se/", "section": "Late filing", "text": "If you file late, Skatteverket can charge a late filing fee (f\u00f6rseningsavgift)."}, {"chunk_id": "transportstyrelsen-driving-licence#0", "doc_id": "transportstyrelsen-driving-licence", "title": "Using a foreign driving licence in Sweden", "agency": "Transportstyrelsen (Swedish Transport Agency)", "url": "https://www.transportstyrelsen.se/", "section": "Licences from the EU or EEA", "text": "A v         sentences(h.chunk.text).forEach((s, pos) => {
          const sTerms = new Set(contentTerms(s));
          let overlap = 0;
          for (const alts of qmap.values()) {
            const hit = [...alts].filter((a) => sTerms.has(a));
            if (hit.length) {

            }

<script>
/* CiviCite page UI */
(() => {

    warn: ['M12 3 2 21h20L12 3Z', 'M12 10v5', 'M12 18h.01'], lock: ['M6 11h12v10H6z', 'M8 11V8a4 4 0 0 1 8 0v3'],
    check: ['M20 6 9 17l-5-5'], cross: ['M18 6 6 18', 'M6 6l12 12'], dash: ['M6 12h12'],

    receipt: ['M6 3h12v18l-3-2-3 2-3-2-3 2V3Z', 'M9 8h6', 'M9 12h6', 'M9 16h3'],
    baby: ['M12 3a4 4 0 1 1 0 8 4 4 0 0 1 0-8Z', 'M5 21c.5-4 3.3-7 7-7s6.5 3 7 7', 'M10.5 7h.01', 'M13.5 7h.01'],
